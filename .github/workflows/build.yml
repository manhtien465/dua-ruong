name: Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: DuaRuong/Library
          key: Library-WebGL-${{ hashFiles('DuaRuong/Assets/**', 'DuaRuong/Packages/**', 'DuaRuong/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: DuaRuong
          unityVersion: 2022.3.62f3
          targetPlatform: WebGL
          buildName: DuaRuong

      - name: Upload WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-webgl
          path: build/WebGL
          retention-days: 7

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-webgl
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-webgl
          path: webgl

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: webgl/DuaRuong

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
